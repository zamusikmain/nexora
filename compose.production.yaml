# Use together with compose.yaml AND compose.security.yaml, behind an HTTPS reverse proxy.
services:
  db:
    restart: unless-stopped
  api:
    build:
      target: production
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      APP_ENV: production
      SEED_DEMO: "false"
      DEMO_PASSWORD: ""
      # Signed retry keys: secret and epoch live outside database dumps (raise the epoch after restoring an old backup).
      OPERATION_KEY_SECRET: ${OPERATION_KEY_SECRET:?Set a random secret of at least 32 characters}
      OPERATION_KEY_EPOCH: ${OPERATION_KEY_EPOCH:-1}
      LEGACY_OPERATION_KEYS_UNTIL: ${LEGACY_OPERATION_KEYS_UNTIL:?Set the end of legacy UUID key retries, e.g. 2026-12-01T00:00:00Z}
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    build:
      context: ./apps/api
      target: production
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nexora}
      APP_ENV: production
      WEB_ORIGIN: ${WEB_ORIGIN:?Set public HTTPS origin}
      MALWARE_SCANNER: clamav
      SEED_DEMO: "false"
      # Production settings validation also runs for the migrator.
      OPERATION_KEY_SECRET: ${OPERATION_KEY_SECRET:?Set a random secret of at least 32 characters}
      LEGACY_OPERATION_KEYS_UNTIL: ${LEGACY_OPERATION_KEYS_UNTIL:?Set the end of legacy UUID key retries}
    depends_on:
      db:
        condition: service_healthy
  web:
    restart: unless-stopped
