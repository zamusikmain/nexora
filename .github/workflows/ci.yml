name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff, mypy, alembic, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: ci-disposable-only
          # Integration fixtures refuse any database not named nexora_test.
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://nexora:ci-disposable-only@localhost:5432/nexora_test
      NEXORA_TEST_DATABASE_URL: postgresql+psycopg://nexora:ci-disposable-only@localhost:5432/nexora_test
      STORAGE_ROOT: /tmp/nexora-uploads
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Ruff
        run: python -m ruff check . ../../ops
      - name: Mypy
        run: python -m mypy app
      - name: Migrations are complete
        run: |
          alembic upgrade head
          alembic check
      - name: Pytest (unit + PostgreSQL integration)
        run: python -m pytest -q -p no:cacheprovider
      - name: Ops tests
        working-directory: ops
        env:
          PYTHONPATH: ${{ github.workspace }}/ops:${{ github.workspace }}/apps/api
        run: python -m pytest -q -p no:cacheprovider tests

  web:
    name: Web (test, lint, typecheck, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: API production image
        run: docker build --target production -t nexora-api:ci apps/api
      - name: Production image does not migrate on start
        run: |
          cmd=$(docker inspect --format '{{json .Config.Cmd}}' nexora-api:ci)
          echo "$cmd"
          case "$cmd" in *alembic*|*seed*) echo "production CMD must only serve"; exit 1;; esac
      - name: Web image
        run: docker build -t nexora-web:ci apps/web
