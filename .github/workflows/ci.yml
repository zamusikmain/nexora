name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff, mypy, alembic, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: ci-disposable-only
          # Integration fixtures refuse any database not named nexora_test.
          POSTGRES_DB: nexora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://nexora:ci-disposable-only@localhost:5432/nexora_test
      NEXORA_TEST_DATABASE_URL: postgresql+psycopg://nexora:ci-disposable-only@localhost:5432/nexora_test
      STORAGE_ROOT: /tmp/nexora-uploads
      PYTHONDONTWRITEBYTECODE: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Ruff
        run: python -m ruff check . ../../ops
      - name: Mypy
        run: python -m mypy app
      - name: Migrations are complete
        run: |
          alembic upgrade head
          alembic check
      - name: Pytest (unit + PostgreSQL integration)
        run: python -m pytest -q -p no:cacheprovider
      - name: Ops tests
        working-directory: ops
        env:
          PYTHONPATH: ${{ github.workspace }}/ops:${{ github.workspace }}/apps/api
        run: python -m pytest -q -p no:cacheprovider tests

  web:
    name: Web (test, lint, typecheck, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: nexora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://nexora:ci-disposable-only@localhost:5432/nexora
      APP_ENV: development
      SEED_DEMO: "true"
      WEB_ORIGIN: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3000
      API_INTERNAL_URL: http://127.0.0.1:8000
      STORAGE_ROOT: /tmp/nexora-e2e-uploads
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Generate a throwaway demo password
        run: |
          pw="e2e-$(openssl rand -hex 16)"
          echo "::add-mask::$pw"
          echo "DEMO_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "E2E_PASSWORD=$pw" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.runtime.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start API (migrate, demo seed, serve)
        working-directory: apps/api
        run: |
          python -m pip install -r requirements.runtime.lock
          python -m pip install --no-deps .
          alembic upgrade head
          python -m app.seed
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/api/v1/ready || { cat "$RUNNER_TEMP/api.log"; exit 1; }
          # The presentation dataset must keep working against the real API (and is idempotent).
          python -m app.demo --api http://127.0.0.1:8000
          python -m app.demo --api http://127.0.0.1:8000 | grep -q "already present"
      - name: Build and start web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          nohup npx next start -H 127.0.0.1 -p 3000 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/login && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/web.log"; exit 1
      - name: Playwright
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: API production image
        run: docker build --target production -t nexora-api:ci apps/api
      - name: Production image does not migrate on start
        run: |
          cmd=$(docker inspect --format '{{json .Config.Cmd}}' nexora-api:ci)
          echo "$cmd"
          case "$cmd" in *alembic*|*seed*) echo "production CMD must only serve"; exit 1;; esac
      - name: Web image
        run: docker build -t nexora-web:ci apps/web
